<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnGuard - enterprise vulnerability management platform">
  <title>Users · VulnGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <aside class="app-sidebar" data-role="app-sidebar" aria-label="Sidebar"></aside>
 
  <div class="app-main">
    <header class="app-header" data-role="app-header"></header>
    <main class="app-content fade-in">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1">Users</h1>
          <p class="text-muted mb-0">Accounts, roles and access management</p>
        </div>
        <button class="btn btn-primary" type="button" data-action="create-user">
          <i class="fa-solid fa-user-plus me-2"></i>New user
        </button>
      </div>
 
      <div class="vg-card">
        <div class="vg-card__body table-responsive">
          <table class="table table-hover align-middle w-100" data-role="users-table">
            <thead>
              <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last login</th>
                  <th class="text-end">Actions</th></tr>
            </thead>
          </table>
        </div>
      </div>
    </main>
  </div>
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script type="module" src="../assets/js/pages/users.js"></script>
</body>
</html>
