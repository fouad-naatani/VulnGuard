<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnGuard - sign in">
  <title>Sign in · VulnGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-page">
  <section class="login-card">
    <div class="login-card__logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h1 class="h4 text-center mb-1">VulnGuard</h1>
    <p class="text-center text-muted mb-4">Vulnerability management platform</p>
 
    <div class="alert alert-danger d-none" role="alert" data-role="login-error"></div>
 
    <form method="post" action="/api/login" novalidate data-role="login-form">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control" id="email" name="email" autocomplete="username"
                 placeholder="you@company.com" required>
          <div class="invalid-feedback">Enter a valid email address</div>
        </div>
      </div>
 
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password"
                 autocomplete="current-password" placeholder="••••••••••" required>
          <button class="btn btn-outline-secondary" type="button" data-action="toggle-password"
                  aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          <div class="invalid-feedback">Password is required</div>
        </div>
      </div>
 
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember" name="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="#" data-action="forgot-password">Forgot password?</a>
      </div>
 
      <button class="btn btn-primary w-100 py-2" type="submit" data-role="login-submit">
        <span class="spinner-border spinner-border-sm me-2 d-none" data-role="login-spinner"
              aria-hidden="true"></span>
        <span data-role="login-label">Sign in</span>
      </button>
    </form>
 
    <div class="login-success d-none" data-role="login-success">
      <i class="fa-solid fa-circle-check"></i>
      <span>Authentication successful, loading your dashboard…</span>
    </div>
 
    <p class="text-center text-muted small mt-4 mb-0">
      Protected area. All authentication attempts are logged.
    </p>
  </section>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/pages/login.js"></script>
</body>
</html>
