<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnGuard - enterprise vulnerability management platform">
  <title>Asset detail · VulnGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <aside class="app-sidebar" data-role="app-sidebar" aria-label="Sidebar"></aside>
 
  <div class="app-main">
    <header class="app-header" data-role="app-header"></header>
    <main class="app-content fade-in">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/assets">Assets</a></li>
          <li class="breadcrumb-item active" aria-current="page" data-role="breadcrumb">Detail</li>
        </ol>
      </nav>
 
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1" data-role="asset-hostname">—</h1>
          <p class="text-muted mb-0" data-role="asset-subtitle">—</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary d-none" type="button" data-action="scan-asset">
            <i class="fa-solid fa-radar me-2"></i>Scan now
          </button>
          <button class="btn btn-outline-secondary" type="button" data-action="export">
            <i class="fa-solid fa-file-arrow-down me-2"></i>Report
          </button>
        </div>
      </div>
 
      <div class="row g-3 mb-4" data-role="asset-stats"></div>
 
      <div class="row g-3">
        <div class="col-12 col-xl-4">
          <div class="vg-card h-100">
            <div class="vg-card__header">Asset information</div>
            <div class="vg-card__body"><dl class="row mb-0" data-role="asset-info"></dl></div>
          </div>
        </div>
        <div class="col-12 col-xl-8">
          <div class="vg-card h-100">
            <div class="vg-card__header">Vulnerabilities</div>
            <div class="vg-card__body table-responsive">
              <table class="table table-hover align-middle w-100" data-role="asset-vulns">
                <thead><tr><th>CVE</th><th>Severity</th><th>CVSS</th><th>Package</th><th>Fixed in</th><th>Status</th></tr></thead>
              </table>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="vg-card">
            <div class="vg-card__header">Scan history</div>
            <div class="vg-card__body table-responsive">
              <table class="table table-hover align-middle w-100" data-role="asset-scans">
                <thead><tr><th>Name</th><th>Scanner</th><th>Status</th><th>Findings</th><th>Started</th><th>Duration</th></tr></thead>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script type="module" src="../assets/js/pages/asset-detail.js"></script>
</body>
</html>
