<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnGuard - enterprise vulnerability management platform">
  <title>Vulnerabilities · VulnGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <aside class="app-sidebar" data-role="app-sidebar" aria-label="Sidebar"></aside>
 
  <div class="app-main">
    <header class="app-header" data-role="app-header"></header>
    <main class="app-content fade-in">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1">Vulnerabilities</h1>
          <p class="text-muted mb-0">Every finding detected across the estate</p>
        </div>
        <button class="btn btn-outline-primary" type="button" data-action="export">
          <i class="fa-solid fa-file-csv me-2"></i>Export CSV
        </button>
      </div>
 
      <div class="vg-card mb-3">
        <div class="vg-card__body">
          <form class="row g-2 align-items-end" data-role="filters">
            <div class="col-12 col-md-3">
              <label class="form-label" for="filter-search">Search</label>
              <input type="search" class="form-control" id="filter-search" name="search" placeholder="CVE, package, title">
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label" for="filter-severity">Severity</label>
              <select class="form-select" id="filter-severity" name="severity">
                <option value="">All</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
                <option value="info">Info</option>
              </select>
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label" for="filter-status">Status</label>
              <select class="form-select" id="filter-status" name="status">
                <option value="">All</option>
                <option value="open">Open</option>
                <option value="in_progress">In progress</option>
                <option value="fixed">Fixed</option>
                <option value="accepted_risk">Accepted risk</option>
                <option value="false_positive">False positive</option>
              </select>
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label" for="filter-min-cvss">Min CVSS</label>
              <input type="number" class="form-control" id="filter-min-cvss" name="min_cvss" min="0" max="10" step="0.1">
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label" for="filter-exploit">Exploit</label>
              <select class="form-select" id="filter-exploit" name="exploit_available">
                <option value="">All</option>
                <option value="true">Available</option>
                <option value="false">None known</option>
              </select>
            </div>
            <div class="col-12 col-md-1 d-grid">
              <button class="btn btn-outline-primary" type="submit"><i class="fa-solid fa-filter"></i></button>
            </div>
          </form>
        </div>
      </div>
 
      <div class="vg-card">
        <div class="vg-card__body table-responsive">
          <table class="table table-hover align-middle w-100" data-role="vulns-table">
            <thead>
              <tr><th>CVE</th><th>Severity</th><th>CVSS</th><th>Package</th><th>Installed</th>
                  <th>Fixed in</th><th>Asset</th><th>Status</th><th class="text-end">Actions</th></tr>
            </thead>
          </table>
        </div>
      </div>
    </main>
  </div>
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script type="module" src="../assets/js/pages/vulnerabilities.js"></script>
</body>
</html>
