<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnGuard - enterprise vulnerability management platform">
  <title>Scans · VulnGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <aside class="app-sidebar" data-role="app-sidebar" aria-label="Sidebar"></aside>
 
  <div class="app-main">
    <header class="app-header" data-role="app-header"></header>
    <main class="app-content fade-in">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1">Scans</h1>
          <p class="text-muted mb-0">Launch and monitor vulnerability scans</p>
        </div>
        <button class="btn btn-primary" type="button" data-action="create-scan">
          <i class="fa-solid fa-plus me-2"></i>New scan
        </button>
      </div>
 
      <div class="vg-card mb-3">
        <div class="vg-card__body">
          <form class="row g-2 align-items-end" data-role="filters">
            <div class="col-12 col-md-4">
              <label class="form-label" for="filter-search">Search</label>
              <input type="search" class="form-control" id="filter-search" name="search" placeholder="Name or target">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="filter-status">Status</label>
              <select class="form-select" id="filter-status" name="status">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="running">Running</option>
                <option value="completed">Completed</option>
                <option value="failed">Failed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="filter-scanner">Scanner</label>
              <select class="form-select" id="filter-scanner" name="scanner">
                <option value="">All</option>
                <option value="TRIVY">Trivy</option>
                <option value="WAZUH">Wazuh</option>
                <option value="NESSUS">Nessus</option>
              </select>
            </div>
            <div class="col-12 col-md-2 d-grid">
              <button class="btn btn-outline-primary" type="submit"><i class="fa-solid fa-filter me-2"></i>Filter</button>
            </div>
          </form>
        </div>
      </div>
 
      <div class="vg-card">
        <div class="vg-card__body table-responsive">
          <table class="table table-hover align-middle w-100" data-role="scans-table">
            <thead>
              <tr><th>Name</th><th>Scanner</th><th>Target</th><th>Status</th><th>Progress</th>
                  <th>Findings</th><th>Started</th><th class="text-end">Actions</th></tr>
            </thead>
          </table>
        </div>
      </div>
    </main>
  </div>
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script type="module" src="../assets/js/pages/scans.js"></script>
</body>
</html>
