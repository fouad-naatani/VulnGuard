<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnGuard - enterprise vulnerability management platform">
  <title>Settings · VulnGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <aside class="app-sidebar" data-role="app-sidebar" aria-label="Sidebar"></aside>
 
  <div class="app-main">
    <header class="app-header" data-role="app-header"></header>
    <main class="app-content fade-in">
      <div class="mb-4">
        <h1 class="h3 mb-1">Settings</h1>
        <p class="text-muted mb-0">Platform configuration and integrations</p>
      </div>
 
      <div class="row g-3">
        <div class="col-12 col-xl-6">
          <div class="vg-card mb-3">
            <div class="vg-card__header">API</div>
            <div class="vg-card__body">
              <label class="form-label" for="setting-api-url">API base URL</label>
              <input type="url" class="form-control mb-2" id="setting-api-url"
                     placeholder="http://localhost:8000/api">
              <small class="text-muted d-block mb-3">
                Leave empty to auto-detect the backend from the current origin.
              </small>
              <button class="btn btn-outline-primary" type="button" data-action="save-api-url">
                Save API URL
              </button>
            </div>
          </div>
 
          <div class="vg-card mb-3">
            <div class="vg-card__header">Appearance</div>
            <div class="vg-card__body">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="setting-dark-mode">
                <label class="form-check-label" for="setting-dark-mode">Dark mode</label>
              </div>
            </div>
          </div>
 
          <div class="vg-card">
            <div class="vg-card__header">Change my password</div>
            <div class="vg-card__body">
              <form novalidate data-role="password-form">
                <div class="mb-3">
                  <label class="form-label" for="current-password">Current password</label>
                  <input type="password" class="form-control" id="current-password" autocomplete="current-password" required>
                  <div class="invalid-feedback">Current password is required</div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="new-password">New password</label>
                  <input type="password" class="form-control" id="new-password" autocomplete="new-password" required>
                  <div class="invalid-feedback">Password policy not met</div>
                </div>
                <button class="btn btn-primary" type="submit">Update password</button>
              </form>
            </div>
          </div>
        </div>
 
        <div class="col-12 col-xl-6">
          <div class="vg-card">
            <div class="vg-card__header">
              Platform settings
              <button class="btn btn-primary btn-sm d-none" type="button" data-action="save-settings">
                <i class="fa-solid fa-floppy-disk me-2"></i>Save
              </button>
            </div>
            <div class="vg-card__body" data-role="settings-groups"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/pages/settings.js"></script>
</body>
</html>
