<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnGuard - enterprise vulnerability management platform">
  <title>Dashboard · VulnGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <aside class="app-sidebar" data-role="app-sidebar" aria-label="Sidebar"></aside>
 
  <div class="app-main">
    <header class="app-header" data-role="app-header"></header>
    <main class="app-content fade-in">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1">Security dashboard</h1>
          <p class="text-muted mb-0">Consolidated exposure across every monitored asset</p>
        </div>
        <button class="btn btn-outline-primary" type="button" data-action="refresh">
          <i class="fa-solid fa-rotate me-2"></i>Refresh
        </button>
      </div>
 
      <div class="row g-3 mb-4" data-role="stat-cards"></div>
 
      <div class="row g-3 mb-4">
        <div class="col-12 col-xl-4">
          <div class="vg-card h-100">
            <div class="vg-card__header">Severity distribution</div>
            <div class="vg-card__body"><div style="height:280px"><canvas data-role="chart-severity"></canvas></div></div>
          </div>
        </div>
        <div class="col-12 col-xl-4">
          <div class="vg-card h-100">
            <div class="vg-card__header">CVSS distribution</div>
            <div class="vg-card__body"><div style="height:280px"><canvas data-role="chart-cvss"></canvas></div></div>
          </div>
        </div>
        <div class="col-12 col-xl-4">
          <div class="vg-card h-100">
            <div class="vg-card__header">Monthly scan history</div>
            <div class="vg-card__body"><div style="height:280px"><canvas data-role="chart-monthly"></canvas></div></div>
          </div>
        </div>
      </div>
 
      <div class="row g-3">
        <div class="col-12 col-xl-6">
          <div class="vg-card h-100">
            <div class="vg-card__header">
              Recent assets <a class="small" href="/assets">View all</a>
            </div>
            <div class="vg-card__body table-responsive">
              <table class="table table-hover align-middle" data-role="table-assets">
                <thead><tr><th>Hostname</th><th>IP</th><th>Agent</th><th>Last scan</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-12 col-xl-6">
          <div class="vg-card h-100">
            <div class="vg-card__header">
              Top vulnerabilities <a class="small" href="/vulnerabilities">View all</a>
            </div>
            <div class="vg-card__body table-responsive">
              <table class="table table-hover align-middle" data-role="table-vulns">
                <thead><tr><th>CVE</th><th>Severity</th><th>CVSS</th><th>Package</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="vg-card">
            <div class="vg-card__header">
              Recent scan jobs <a class="small" href="/scans">View all</a>
            </div>
            <div class="vg-card__body table-responsive">
              <table class="table table-hover align-middle" data-role="table-scans">
                <thead><tr><th>Name</th><th>Scanner</th><th>Target</th><th>Status</th><th>Progress</th><th>Started</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
