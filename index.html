<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VulnGuard - vulnerability management platform">
  <title>VulnGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
    .landing { width: min(760px, 92vw); text-align: center; padding: 3rem 2rem; }
    .landing-logo { font-size: 4rem; margin-bottom: 1rem; }
    .landing h1 { font-size: clamp(2.5rem, 7vw, 4.5rem); margin-bottom: .75rem; }
    .landing p { max-width: 620px; margin: 0 auto 2rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main class="landing">
    <div class="landing-logo" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>VulnGuard</h1>
    <p>Centralized vulnerability management for security teams, pentesters and SOC analysts.</p>
    <a class="btn btn-primary btn-lg px-5" href="/login">Get Started <i class="fa-solid fa-arrow-right ms-2"></i></a>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
</body>
</html>
